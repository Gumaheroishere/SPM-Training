<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Kuiz Sejarah SPM</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-2: #22262f;
    --line: #2c313c;
    --text: #e8eaee;
    --muted: #8b93a7;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --green: #22c55e;
    --green-dark: #16a34a;
    --red: #ef4444;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100dvh;
  }
  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    position: relative;
    background: var(--bg);
  }

  /* TOP BAR */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(15,17,21,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .menu-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .menu-btn span {
    width: 18px; height: 2px;
    background: var(--text);
    border-radius: 2px;
  }
  .menu-btn:active { transform: scale(0.94); }
  .title-block { flex: 1; min-width: 0; }
  .title-block h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
  .title-block p { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .score-pill {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 11px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* PROGRESS */
  .progress-wrap { padding: 0 14px; margin-top: 12px; }
  .progress-bar {
    height: 5px;
    background: var(--card);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    width: 0%;
    transition: width 0.35s ease;
    border-radius: 999px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* QUIZ BODY */
  .quiz-body {
    flex: 1;
    padding: 16px 14px 130px;
    overflow-y: auto;
  }
  .q-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .q-number {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }
  .q-bab {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(99,102,241,0.15);
    color: #a5b4fc;
    border: 1px solid rgba(99,102,241,0.3);
  }
  .q-text {
    font-size: 16px;
    line-height: 1.55;
    font-weight: 500;
    margin-bottom: 18px;
  }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .option:active { transform: scale(0.985); }
  .option.selected {
    border-color: var(--accent);
    background: rgba(99,102,241,0.1);
  }
  .option.correct {
    border-color: var(--green);
    background: rgba(34,197,94,0.1);
  }
  .option.wrong {
    border-color: var(--red);
    background: rgba(239,68,68,0.1);
  }
  .option.locked { cursor: default; }
  .option.locked:active { transform: none; }
  .option-letter {
    width: 26px; height: 26px;
    border-radius: 8px;
    background: var(--card-2);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
  }
  .option.selected .option-letter {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .option.correct .option-letter {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .option.wrong .option-letter {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }
  .option-text {
    font-size: 14px;
    line-height: 1.5;
    flex: 1;
    padding-top: 2px;
  }

  /* FEEDBACK */
  .feedback {
    margin-top: 16px;
    padding: 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.55;
    display: none;
    animation: slideIn 0.25s ease;
  }
  .feedback.show { display: block; }
  .feedback.correct {
    background: rgba(34,197,94,0.08);
    border: 1px solid rgba(34,197,94,0.25);
  }
  .feedback.wrong {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.25);
  }
  .feedback strong {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 700;
  }
  .feedback.correct strong { color: var(--green); }
  .feedback.wrong strong { color: var(--red); }
  .feedback em {
    font-style: normal;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.55;
    display: block;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* BOTTOM CONTROLS */
  .controls {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: rgba(15,17,21,0.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    z-index: 20;
  }
  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s ease;
  }
  button:active:not(:disabled) { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .btn-next {
    flex: 1;
    height: 44px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 14px;
    padding: 0 12px;
  }
  .btn-next.ready {
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 14px rgba(34,197,94,0.35);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 14px rgba(34,197,94,0.35); }
    50% { box-shadow: 0 4px 22px rgba(34,197,94,0.6); }
  }

  /* DRAWER */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 30;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0; left: 0;
    width: 82%;
    max-width: 340px;
    height: 100dvh;
    background: var(--card);
    border-right: 1px solid var(--line);
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 40;
    display: flex;
    flex-direction: column;
  }
  .drawer.show { transform: translateX(0); }

  .drawer-head {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--line);
  }
  .drawer-head h2 { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .drawer-head p { font-size: 11.5px; color: var(--muted); }

  .legend {
    display: flex;
    gap: 12px;
    padding: 12px 18px;
    font-size: 11px;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .dot.d-answered { background: var(--accent); }
  .dot.d-correct { background: var(--green); }
  .dot.d-wrong { background: var(--red); }
  .dot.d-empty { background: var(--card-2); border: 1px solid var(--line); }

  .grid-nav {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 20px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    align-content: start;
  }
  .grid-nav button {
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .grid-nav button.answered {
    background: rgba(99,102,241,0.18);
    border-color: rgba(99,102,241,0.4);
    color: #a5b4fc;
  }
  .grid-nav button.correct {
    background: rgba(34,197,94,0.18);
    border-color: rgba(34,197,94,0.4);
    color: #4ade80;
  }
  .grid-nav button.wrong {
    background: rgba(239,68,68,0.18);
    border-color: rgba(239,68,68,0.4);
    color: #f87171;
  }
  .grid-nav button.current {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    color: var(--text);
  }

  .drawer-foot {
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    display: flex;
    gap: 8px;
  }
  .btn-reset-sm {
    flex: 1;
    height: 40px;
    border-radius: 10px;
    background: rgba(239,68,68,0.12);
    border: 1px solid rgba(239,68,68,0.3);
    color: #f87171;
    font-size: 12.5px;
  }

  /* SUMMARY */
  .summary {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .summary.show { display: flex; }
  .summary-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 22px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .summary-card h2 { font-size: 18px; margin-bottom: 10px; }
  .score-big {
    font-size: 44px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 10px 0;
    letter-spacing: -1px;
  }
  .summary-card p {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .btn-primary-full {
    width: 100%;
    height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 14px;
  }

  /* JUMPSCARE */
  .jumpscare {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    overflow: hidden;
  }
  .jumpscare.show {
    display: flex;
    /* ✅ FLICKER SAHAJA — buang 'shake' */
    animation: creepypastaStrobe 0.04s infinite;
  }
  .jumpscare img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: imageFlicker 0.06s infinite;
  }
  
  /* CREEPYPASTA FLICKER ANIMATIONS */
  @keyframes creepypastaStrobe {
    0% { background-color: #000; }
    50% { background-color: #fff; }
    100% { background-color: #000; }
  }
  @keyframes imageFlicker {
    0% { opacity: 1; filter: invert(0) contrast(1); }
    20% { opacity: 0.1; filter: invert(0.8) contrast(2); }
    40% { opacity: 0.9; filter: invert(0) hue-rotate(90deg); }
    60% { opacity: 0.2; filter: invert(1) contrast(3); }
    80% { opacity: 1; filter: invert(0) saturate(2); }
    100% { opacity: 0.3; filter: invert(0.5); }
  }
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <button class="menu-btn" onclick="openDrawer()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="title-block">
      <h1>Kuiz Sejarah SPM</h1>
      <p id="subtitle">Tingkatan 4 & 5 · 100 soalan</p>
    </div>
    <div class="score-pill" id="scorePill">0/100</div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-meta">
      <span id="progressLabel">0 dijawab</span>
      <span id="progressPct">0%</span>
    </div>
  </div>

  <!-- QUIZ BODY -->
  <div class="quiz-body" id="quizBody">
    <div class="q-meta">
      <span class="q-number" id="qNumber">Soalan 1 / 100</span>
      <span class="q-bab" id="qBab">T4 Bab 1</span>
    </div>
    <div class="q-text" id="qText">Memuatkan...</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- BOTTOM CONTROLS -->
  <div class="controls">
    <button class="btn-icon" id="btnPrev" onclick="prevQ()" aria-label="Sebelum">←</button>
    <button class="btn-next" id="btnNext" onclick="nextQ()">Pilih jawapan dahulu</button>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay" onclick="closeDrawer()"></div>

  <!-- DRAWER -->
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h2>Pilih Soalan</h2>
      <p>Lompat ke mana-mana soalan</p>
    </div>
    <div class="legend">
      <span><i class="dot d-empty"></i>Belum</span>
      <span><i class="dot d-correct"></i>Betul</span>
      <span><i class="dot d-wrong"></i>Salah</span>
    </div>
    <div class="grid-nav" id="gridNav"></div>
    <div class="drawer-foot">
      <button class="btn-reset-sm" onclick="resetQuiz()">Reset Semua</button>
    </div>
  </aside>

  <!-- SUMMARY -->
  <div class="summary" id="summary">
    <div class="summary-card">
      <h2>🎉 Kuiz Selesai!</h2>
      <div class="score-big" id="finalScore">0 / 100</div>
      <p id="finalMsg"></p>
      <button class="btn-primary-full" onclick="closeSummary(); resetQuiz();">Mula Semula</button>
    </div>
  </div>

  <!-- JUMPSCARE OVERLAY -->
  <div class="jumpscare" id="jumpscare">
    <img src="jumpscare.jpg" alt="">
  </div>

  <!-- AUDIO (hidden) -->
  <audio id="screamAudio" src="scream.mp3" preload="auto" loop></audio>

</div>

<script>
// ============ BANK SOALAN (100 soalan) ============
const QUESTIONS = [
  {t:4, bab:"T4 Bab 1", q:"Apakah maksud 'negara bangsa' dalam konteks sejarah awal Asia Tenggara?",
   o:["Negara yang diperintah oleh raja asing","Negara yang mempunyai sempadan, rakyat dan kedaulatan","Negara yang dijajah oleh kuasa Barat","Negara yang tidak mempunyai sistem pemerintahan"], a:1,
   e:"Negara bangsa merujuk kepada negara yang mempunyai sempadan yang jelas, rakyat yang taat setia dan kedaulatan yang diiktiraf."},
  {t:4, bab:"T4 Bab 1", q:"Apakah ciri utama kerajaan agraria di Asia Tenggara?",
   o:["Bergantung pada perdagangan maritim","Bergantung pada pertanian dan hasil bumi","Bergantung pada perlombongan bijih timah","Bergantung pada industri pembuatan"], a:1,
   e:"Kerajaan agraria seperti Angkor dan Funan bergantung pada pertanian, terutamanya penanaman padi."},
  {t:4, bab:"T4 Bab 1", q:"Kerajaan Srivijaya merupakan kerajaan maritim yang berpusat di manakah?",
   o:["Palembang, Sumatera","Angkor, Kemboja","Pagoh, Johor","Ayutthaya, Siam"], a:0,
   e:"Srivijaya berpusat di Palembang, Sumatera dan menjadi pusat perdagangan maritim utama."},
  {t:4, bab:"T4 Bab 1", q:"Apakah kepentingan Sungai Mekong kepada kerajaan Funan?",
   o:["Sebagai sempadan semula jadi","Sebagai laluan perdagangan dan sumber air","Sebagai tempat perlindungan","Sebagai kawasan perlombongan"], a:1,
   e:"Sungai Mekong menjadi nadi ekonomi Funan kerana menyediakan air, tanah subur dan laluan perdagangan."},
  {t:4, bab:"T4 Bab 1", q:"Bahasa Melayu Kuno digunakan dalam kerajaan Srivijaya sebagai bahasa apa?",
   o:["Bahasa rasmi pentadbiran","Bahasa perdagangan","Bahasa keagamaan","Bahasa tentera"], a:0,
   e:"Bahasa Melayu Kuno digunakan sebagai bahasa rasmi dalam pentadbiran Srivijaya."},
  {t:4, bab:"T4 Bab 2", q:"Siapakah yang mengasaskan Kesultanan Melayu Melaka?",
   o:["Sultan Alauddin Riayat Shah","Parameswara","Sultan Mansur Shah","Raja Iskandar Shah"], a:1,
   e:"Parameswara (Raja Iskandar Shah) mengasaskan Melaka sekitar tahun 1400."},
  {t:4, bab:"T4 Bab 2", q:"Apakah faktor utama yang menjadikan Melaka pusat perdagangan antarabangsa?",
   o:["Kedudukan strategik di Selat Melaka","Kawasan pertanian yang luas","Penduduk yang ramai","Kekayaan hasil laut"], a:0,
   e:"Kedudukan Melaka di tengah Selat Melaka menjadikannya persinggahan utama kapal dagang."},
  {t:4, bab:"T4 Bab 2", q:"Apakah maksud 'Sistem Pembesar Empat Lipatan' dalam pentadbiran Melaka?",
   o:["Sistem pemilihan sultan","Sistem pembahagian kuasa pembesar mengikut hierarki","Sistem cukai perdagangan","Sistem ketenteraan"], a:1,
   e:"Sistem ini membahagikan pembesar kepada empat peringkat: Bendahara, Penghulu Bendahari, Temenggung dan Laksamana."},
  {t:4, bab:"T4 Bab 2", q:"Apakah tugas utama Bendahara dalam pentadbiran Melaka?",
   o:["Mengetuai angkatan tentera","Menjaga hasil cukai","Mengetuai pentadbiran dan menjadi penasihat sultan","Mengurus hal ehwal pelabuhan"], a:2,
   e:"Bendahara adalah pembesar tertinggi, mengetuai pentadbiran dan menjadi penasihat utama sultan."},
  {t:4, bab:"T4 Bab 2", q:"Apakah undang-undang yang digunakan dalam Kesultanan Melayu Melaka?",
   o:["Hukum Kanun Melaka dan Undang-Undang Laut Melaka","Undang-Undang Inggeris","Hukum Kanun Johor","Undang-Undang Siam"], a:0,
   e:"Hukum Kanun Melaka dan Undang-Undang Laut Melaka adalah dua undang-undang utama Melaka."},
  {t:4, bab:"T4 Bab 2", q:"Apakah kepentingan Hukum Kanun Melaka?",
   o:["Mengatur perdagangan antarabangsa","Menjadi panduan pentadbiran dan keadilan","Mengatur hubungan diplomatik","Mengatur sistem pendidikan"], a:1,
   e:"Hukum Kanun Melaka menjadi panduan dalam pentadbiran negara dan pelaksanaan keadilan."},
  {t:4, bab:"T4 Bab 2", q:"Apakah maksud 'waadat' dalam konteks hubungan Sultan Melaka dengan rakyat?",
   o:["Perjanjian perdagangan","Ikrar taat setia rakyat kepada sultan","Perjanjian damai","Sistem cukai"], a:1,
   e:"Waadat ialah ikrar taat setia rakyat kepada sultan sebagai lambang kedaulatan."},
  {t:4, bab:"T4 Bab 3", q:"Apakah kerajaan Alam Melayu yang tertua?",
   o:["Kedah Tua","Melaka","Srivijaya","Majapahit"], a:0,
   e:"Kedah Tua (Kataha) dianggap antara kerajaan Alam Melayu tertua, wujud sejak abad ke-2 Masihi."},
  {t:4, bab:"T4 Bab 3", q:"Apakah pengaruh utama dalam kerajaan Majapahit?",
   o:["Islam","Hindu-Buddha","Kristian","Animisme"], a:1,

// ============ SHUFFLE ============
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let RUNTIME = [];

function buildRuntime() {
  RUNTIME = QUESTIONS.map((q) => {
    const correctText = q.o[q.a];
    const shuffled = shuffleArray(q.o);
    return {
      t: q.t,
      bab: q.bab,
      q: q.q,
      o: shuffled,
      a: shuffled.indexOf(correctText),
      e: q.e
    };
  });
}

// ============ STATE ============
let state = {
  current: 0,
  answers: {},
  checked: {}
};

// ============ LOAD / SAVE ============
// State TIDAK disimpan — refresh = reset automatik
function saveState() { /* sengaja kosong */ }
function loadState() { /* sengaja kosong */ }

// ============ RENDER ============
function render() {
  const q = RUNTIME[state.current];
  const total = QUESTIONS.length;
  const answered = Object.keys(state.answers).length;
  const isAnswered = state.checked[state.current] === true;

  document.getElementById('qNumber').textContent = `Soalan ${state.current + 1} / ${total}`;
  document.getElementById('qBab').textContent = q.bab;
  document.getElementById('qText').textContent = q.q;

  // options
  const optDiv = document.getElementById('options');
  optDiv.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.o.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    const isSelected = state.answers[state.current] === i;

    if (isAnswered) {
      div.classList.add('locked');
      if (i === q.a) div.classList.add('correct');
      if (isSelected && i !== q.a) div.classList.add('wrong');
    } else if (isSelected) {
      div.classList.add('selected');
    }

    div.innerHTML = `<span class="option-letter">${letters[i]}</span><span class="option-text">${opt}</span>`;
    if (!isAnswered) div.onclick = () => selectOption(i);
    optDiv.appendChild(div);
  });

  // feedback
  const fb = document.getElementById('feedback');
  if (isAnswered) {
    const chosen = state.answers[state.current];
    const isCorrect = chosen === q.a;
    fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
    fb.innerHTML = `<strong>${isCorrect ? '✅ Betul!' : '❌ Salah'}</strong>Jawapan: ${letters[q.a]}. ${q.o[q.a]}<em>${q.e}</em>`;
  } else {
    fb.className = 'feedback';
  }

  // score pill
  let correct = 0;
  Object.keys(state.checked).forEach(k => {
    if (state.checked[k] && state.answers[k] === RUNTIME[k].a) correct++;
  });
  document.getElementById('scorePill').textContent = `${correct}/${total}`;

  // progress
  const pct = Math.round(answered / total * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${answered} dijawab`;
  document.getElementById('progressPct').textContent = pct + '%';

  // nav buttons
  document.getElementById('btnPrev').disabled = state.current === 0;
  const nextBtn = document.getElementById('btnNext');
  const isLast = state.current === total - 1;

  if (isAnswered) {
    nextBtn.classList.add('ready');
    if (isLast) {
      nextBtn.textContent = 'Lihat Keputusan 🎉';
    } else {
      nextBtn.textContent = 'Seterusnya →';
    }
    nextBtn.disabled = false;
  } else {
    nextBtn.classList.remove('ready');
    nextBtn.textContent = 'Pilih jawapan dahulu';
    nextBtn.disabled = true;
  }

  // grid nav
  const grid = document.getElementById('gridNav');
  grid.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const b = document.createElement('button');
    b.textContent = i + 1;
    if (state.answers[i] !== undefined) b.classList.add('answered');
    if (state.checked[i]) {
      if (state.answers[i] === RUNTIME[i].a) b.classList.add('correct');
      else b.classList.add('wrong');
    }
    if (i === state.current) b.classList.add('current');
    b.onclick = () => {
      state.current = i;
      saveState();
      render();
      closeDrawer();
      document.getElementById('quizBody').scrollTop = 0;
    };
    grid.appendChild(b);
  }

  saveState();
}

// ============ ACTIONS ============
function selectOption(i) {
  if (state.checked[state.current]) return;
  state.answers[state.current] = i;
  state.checked[state.current] = true;
  saveState();
  render();
  setTimeout(() => {
    document.getElementById('feedback').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

function nextQ() {
  const total = QUESTIONS.length;
  if (!state.checked[state.current]) return;

  if (state.current === total - 1) {
    showSummary();
  } else {
    state.current++;
    saveState();
    render();
    document.getElementById('quizBody').scrollTop = 0;
  }
}

function prevQ() {
  if (state.current > 0) {
    state.current--;
    saveState();
    render();
    document.getElementById('quizBody').scrollTop = 0;
  }
}

function resetQuiz() {
  if (!confirm('Reset semua jawapan? (Susunan jawapan akan di-shuffle semula)')) return;
  state = { current: 0, answers: {}, checked: {} };
  buildRuntime();
  saveState();
  render();
}

// ============ DRAWER ============
function openDrawer() {
  document.getElementById('drawer').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// ============ SUMMARY ============
function showSummary() {
  const total = RUNTIME.length;
  let correct = 0;
  Object.keys(state.checked).forEach(k => {
    if (state.checked[k] && state.answers[k] === RUNTIME[k].a) correct++;
  });
  document.getElementById('finalScore').textContent = `${correct} / ${total}`;
  let msg = '';
  const pct = correct / total * 100;
  if (pct >= 80) msg = 'Cemerlang! Kau dah kuasai sebahagian besar topik.';
  else if (pct >= 60) msg = 'Bagus! Ulang kaji bab yang lemah sikit lagi.';
  else if (pct >= 40) msg = 'Boleh tahan. Fokus pada bab yang banyak salah.';
  else msg = 'Jangan putus asa. Baca semula nota dan cuba lagi.';
  document.getElementById('finalMsg').textContent = msg;
  document.getElementById('summary').classList.add('show');

  // 🎃 JUMPSCARE kalau markah < 50 — LOOP, tak auto hilang
  if (pct < 50) {
    setTimeout(() => triggerJumpscare(), 1200);
  }
}
function closeSummary() {
  document.getElementById('summary').classList.remove('show');
}

// ============ JUMPSCARE (simple, no Web Audio API) ============
// ✅ Guna HTML5 audio sahaja — volume 1.0 = max, loop = true
// Tak guna AudioContext / gainNode supaya volume tak conflict & sound tak hilang.
function triggerJumpscare() {
  const jc = document.getElementById('jumpscare');
  const audio = document.getElementById('screamAudio');

  jc.classList.add('show');

  // Loop + volume max (HTML5 audio — maksimum yang browser benarkan)
  audio.loop = true;
  audio.volume = 1.0;
  audio.currentTime = 0;

  const playPromise = audio.play();
  if (playPromise !== undefined) {
    playPromise.catch(err => console.log('Audio playback prevented:', err));
  }

  if (navigator.vibrate) navigator.vibrate([400, 50, 400, 50, 800, 100, 800, 100, 800]);

  // ❌ TIADA setTimeout — jumpscare + audio loop selamanya
  // Satu-satunya cara keluar: refresh page
}

// ============ INIT ============
// Setiap page load (termasuk refresh) = reset automatik
state = { current: 0, answers: {}, checked: {} };
buildRuntime();
render();
</script>
